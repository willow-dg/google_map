<!DOCTYPE html>
<html>
<head>
    <script
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDJW4jsPlNKgv6jFm3B5Edp5ywgdqLWdmc&callback=initMap"></script>

    <script>
        /*
         * 创建地图
         */
        function initialize() {
            // 地图属性
            var mapProp = {
                // 地图中心点
                center: new google.maps.LatLng(51.508742, -0.120850),
                // 缩放级数：初始加载时的缩放大小
                zoom: 4,
                // 地图类型之一有四种类型：ROADMAP, SATELLITE, HYBRID, TERRAIN
                mapTypeId: google.maps.MapTypeId.ROADMAP,
                //关闭默认控件集
                // disableDefaultUI: true
                //开所有控件集
                // panControl: true,
                zoomControl:true,
                // mapTypeControl:true,
                // scaleControl:true,
                // streetViewControl:true,
                // rotateControl:true

                // 缩放控件
                zoomControlOptions: {
                    style: google.maps.ZoomControlStyle.LARGE
                },
            };
            var mapProp1 = {
                // 地图中心点
                center: new google.maps.LatLng(51.508742, -0.120850),
                // 缩放级数：初始加载时的缩放大小
                zoom: 9,
                // 地图类型之一有四种类型：ROADMAP, SATELLITE, HYBRID, TERRAIN
                mapTypeId: google.maps.MapTypeId.SATELLITE
            };
            var mapProp2 = {
                // 地图中心点
                center: new google.maps.LatLng(51.508742, -0.120850),
                // 缩放级数：初始加载时的缩放大小
                zoom: 9,
                // 地图类型之一有四种类型：ROADMAP, SATELLITE, HYBRID, TERRAIN
                mapTypeId: google.maps.MapTypeId.HYBRID
            };
            var mapProp3 = {
                // 地图中心点
                center: new google.maps.LatLng(51.508742, -0.120850),
                // 缩放级数：初始加载时的缩放大小
                zoom: 9,
                // 地图类型之一有四种类型：ROADMAP, SATELLITE, HYBRID, TERRAIN
                mapTypeId: google.maps.MapTypeId.TERRAIN
            };
            // 创建地图
            var map = new google.maps.Map(document.getElementById("googleMap"), mapProp);
            // var map1 = new google.maps.Map(document.getElementById("googleMap1"), mapProp1);
            // var map2 = new google.maps.Map(document.getElementById("googleMap2"), mapProp2);
            // var map3 = new google.maps.Map(document.getElementById("googleMap3"), mapProp3);

            // 创建标记
            var marker = new google.maps.Marker({
                // 经纬度
                position: new google.maps.LatLng(51.508742, -0.120850),
                // 图标
                Animation: google.maps.Animation.BOUNCE,
                // 图标
                icon: "https://developers.google.com/maps/documentation/javascript/examples/full/images/beachflag.png"
            });

            //声明实现对象
            // 创建路径
            let stavanger = new google.maps.LatLng(58.983991, 5.734863);
            let amsterdam = new google.maps.LatLng(52.370216, 4.895168);
            let london = new google.maps.LatLng(51.507351, -0.127758);
            var myTrip = [stavanger, amsterdam, london, stavanger];
            // 创建线
            /*var flightPath = new google.maps.Polyline({
                // 经纬度
                path: myTrip,
                // 颜色
                strokeColor: "#0000FF",
                // 透明度
                strokeOpacity: 0.8,
                // 线宽
                strokeWeight: 2
            });*/
            // 创建面
            var flightPath = new google.maps.Polygon({
                // 经纬度
                path: myTrip,
                // 颜色
                strokeColor: "#0000FF",
                // 透明度
                strokeOpacity: 0.8,
                // 线宽
                strokeWeight: 2,
                // 填充颜色
                fillColor: "#0000FF",
                // 填充透明度
                fillOpacity: 0.4
            });
            // 创建圆
            var myCity= new google.maps.Circle({
                // 经纬度
                center:amsterdam,
                // 半径
                radius:20000,
                // 颜色
                strokeColor: "#0000FF",
                // 透明度
                strokeOpacity: 0.8,
                // 线宽
                strokeWeight: 2,
                // 填充颜色
                fillColor: "#0000FF",
                // 填充透明度
                fillOpacity: 0.4
            })
            //创建信息窗口
            var infowindow=new google.maps.InfoWindow({
                content:"Hello World!"
            });

            //创建类
            function placeMarker(location){
                var marker=new google.maps.Marker({
                    position:location,
                    map:map,
                });
                var infowindow=new google.maps.InfoWindow({
                    content:'维度(Latitude):'+location.lat()+
                        '<br>经度(Longitude):'+location.lng()
                });
                infowindow.open(map,marker);
            }

            //添加信息窗口
            // infowindow.open(map,marker);
            // 添加线
            flightPath.setMap(map);
            // 添加圆
            myCity.setMap(map);
            // 添加标记
            marker.setMap(map);
            // marker.setMap(map1);
            // marker.setMap(map2);
            // marker.setMap(map3);

            //添加点击标记缩放地图
            google.maps.event.addListener(marker,'click',function(){
                // 放大地图
                map.setZoom(4);
                // 移动地图
                map.setCenter(marker.getPosition());
            });
            //重置标记
            google.maps.event.addListener(map,'center_changed',function(){
                // 延迟3秒
                window.setTimeout(function(){
                    // 移动地图
                    map.panTo(marker.getPosition());
                },3000);
            });
            //点击标记时打开信息窗口
            google.maps.event.addListener(marker,'click',function(){
                //打开信息窗口,在指定地图的指定位置
                infowindow.open(map,marker);
            })


            //点击设置标记机及打开每个标记的信息窗口
            google.maps.event.addListener(map,'click',function(event){
                // 设置标记
                placeMarker(event.latLng);
            })

        }


        // 加载地图
        google.maps.event.addDomListener(window, 'load', initialize);

    </script>
</head>

<body>
<div id="googleMap" style="width:1000px;height:760px;"></div>
<!--<div id="googleMap1" style="width:500px;height:380px;"></div>-->
<!--<div id="googleMap2" style="width:500px;height:380px;"></div>-->
<!--<div id="googleMap3" style="width:500px;height:380px;"></div>-->
</body>
</html>
