<!DOCTYPE html>
<html>
<head>
    <script
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDJW4jsPlNKgv6jFm3B5Edp5ywgdqLWdmc&callback=initMap"></script>

    <script>
        /*
         * 创建地图
         */
        function initialize() {
            // 地图属性
            var mapProp = {
                // 地图中心点
                center: new google.maps.LatLng(51.508742, -0.120850),
                // 缩放级数：初始加载时的缩放大小
                zoom: 9,
                // 地图类型之一有四种类型：ROADMAP, SATELLITE, HYBRID, TERRAIN
                mapTypeId: google.maps.MapTypeId.ROADMAP
            };
            var mapProp1 = {
                // 地图中心点
                center: new google.maps.LatLng(51.508742, -0.120850),
                // 缩放级数：初始加载时的缩放大小
                zoom: 9,
                // 地图类型之一有四种类型：ROADMAP, SATELLITE, HYBRID, TERRAIN
                mapTypeId: google.maps.MapTypeId.SATELLITE
            };
            var mapProp2 = {
                // 地图中心点
                center: new google.maps.LatLng(51.508742, -0.120850),
                // 缩放级数：初始加载时的缩放大小
                zoom: 9,
                // 地图类型之一有四种类型：ROADMAP, SATELLITE, HYBRID, TERRAIN
                mapTypeId: google.maps.MapTypeId.HYBRID
            };
            var mapProp3 = {
                // 地图中心点
                center: new google.maps.LatLng(51.508742, -0.120850),
                // 缩放级数：初始加载时的缩放大小
                zoom: 9,
                // 地图类型之一有四种类型：ROADMAP, SATELLITE, HYBRID, TERRAIN
                mapTypeId: google.maps.MapTypeId.TERRAIN
            };
            // 创建地图
            var map = new google.maps.Map(document.getElementById("googleMap"), mapProp);
            // var map1 = new google.maps.Map(document.getElementById("googleMap1"), mapProp1);
            // var map2 = new google.maps.Map(document.getElementById("googleMap2"), mapProp2);
            // var map3 = new google.maps.Map(document.getElementById("googleMap3"), mapProp3);

            var marker = new google.maps.Marker({
                position: new google.maps.LatLng(51.508742, -0.120850),
                Animation: google.maps.Animation.BOUNCE,
                 icon: "https://developers.google.com/maps/documentation/javascript/examples/full/images/beachflag.png"
                // icon: {
                //     url: "resource/Dragon.png", // 自定义图片的URL（可以替换成自己的图片地址）
                //     scaledSize: new google.maps.Size(40, 40), // 缩放图片的尺寸（宽高，单位：像素）
                //     origin: new google.maps.Point(0, 0), // 图片的起始点（默认0,0即可）
                //     anchor: new google.maps.Point(20, 40), // 标记的锚点（对应图片的哪个点指向坐标，这里是图片底部中点）
                // },
            });

            marker.setMap(map);
            // marker.setMap(map1);
            // marker.setMap(map2);
            // marker.setMap(map3);

        }

        // 加载地图
        google.maps.event.addDomListener(window, 'load', initialize);

    </script>
</head>

<body>
<div id="googleMap" style="width:500px;height:380px;"></div>
<!--<div id="googleMap1" style="width:500px;height:380px;"></div>-->
<!--<div id="googleMap2" style="width:500px;height:380px;"></div>-->
<!--<div id="googleMap3" style="width:500px;height:380px;"></div>-->
</body>
</html>
